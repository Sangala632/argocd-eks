apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop
  namespace: argocd # Must be the namespace where Argo CD is installed
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: roboshop   # AppProject to which the application belongs
  source:
    repoURL: https://github.com/Sangala632/argocd-eks.git
    targetRevision: main
    path: roboshop # Path within the repo containing manifests
  destination:
    server: https://kubernetes.default.svc # Internal cluster address
    namespace: argocd            # Target namespace for the app
  syncPolicy:
    automated: # Automatically syncs when Git changes
      prune: true
      selfHeal: true